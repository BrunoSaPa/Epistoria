name: Epistoria
options:
  bundleIdPrefix: com.epistoria
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  EpistoriaCore:
    path: EpistoriaCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  Epistoria:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Epistoria
    dependencies:
      - package: EpistoriaCore
      - target: EpistoriaShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epistoria.notebook
        PRODUCT_NAME: Epistoria
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Epistoria/Resources/Epistoria.entitlements
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Epistoria/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  EpistoriaShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EpistoriaShareExtension
    dependencies:
      - package: EpistoriaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epistoria.notebook.share
        PRODUCT_NAME: EpistoriaShareExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: EpistoriaShareExtension/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: EpistoriaShareExtension/Resources/EpistoriaShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "2"
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Automatic
  EpistoriaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EpistoriaTests
    dependencies:
      - target: Epistoria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  EpistoriaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: EpistoriaUITests
    dependencies:
      - target: Epistoria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  Epistoria:
    build:
      targets:
        Epistoria: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - EpistoriaTests
        - EpistoriaUITests
