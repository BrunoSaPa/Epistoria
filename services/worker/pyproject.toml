[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "epistoria-worker"
version = "0.1.0"
description = "Trusted Mac processing worker for Epistoria"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary — personal project" }
dependencies = [
  "httpx>=0.28,<1",
  "mnemonic>=0.21,<1",
  "openai>=2,<3",
  "pdfplumber>=0.11.10,<0.12",
  "pydantic>=2.11,<3",
  "PyNaCl>=1.5,<2",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
epistoria-worker = "epistoria_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epistoria_worker"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["epistoria_worker"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*"]
ignore_missing_imports = true
