name: security

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository-and-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/worker/requirements.lock
      - name: Scan tracked and untracked repository files for credential formats
        run: scripts/scan-secrets.sh
      - name: Install pinned Node dependencies
        run: npm ci --strict-allow-scripts
      - name: Audit Node production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install worker from the exact dependency lock
        run: scripts/install-worker.sh
      - name: Audit the worker dependency lock
        run: services/worker/.venv/bin/python -m pip_audit --requirement services/worker/requirements.lock
