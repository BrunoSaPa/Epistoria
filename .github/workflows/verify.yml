name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-worker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/worker/requirements.lock
      - run: npm ci --strict-allow-scripts
      - run: scripts/install-worker.sh
      - run: scripts/scan-secrets.sh
      - run: node scripts/validate-contracts.mjs
      - run: node scripts/check-public-docs.mjs
      - run: npm run verify
      - run: services/worker/.venv/bin/python -m ruff check services/worker
      - run: >-
          services/worker/.venv/bin/python -m mypy
          --config-file services/worker/pyproject.toml
          services/worker/src
      - run: services/worker/.venv/bin/python -m pytest -q services/worker/tests
      - run: make api-test-e2e
      - if: always()
        run: make infra-down

  swift:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Test core
        working-directory: apps/ios/EpistoriaCore
        run: swift test
      - name: Build iPad app
        run: >-
          xcodebuild -quiet
          -project apps/ios/Epistoria.xcodeproj
          -scheme Epistoria
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/EpistoriaDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run iOS application and UI tests
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(
            xcrun simctl list devices available -j |
              /usr/bin/python3 -c 'import json, re, sys; data = json.load(sys.stdin); candidates = [(tuple(map(int, re.findall(r"\d+", runtime))), device["udid"]) for runtime, devices in data["devices"].items() for device in devices if device.get("isAvailable") and device["name"].startswith("iPad") and tuple(map(int, re.findall(r"\d+", runtime))) >= (18,)]; print(max(candidates)[1])'
          )"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -quiet \
            -project apps/ios/Epistoria.xcodeproj \
            -scheme Epistoria \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/EpistoriaTestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -parallel-testing-enabled NO \
            test
